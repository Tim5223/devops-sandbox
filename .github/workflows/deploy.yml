name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            cd ~/devops-sandbox

            # Clean up pycache created by Docker (root-owned files)
            sudo rm -rf app/__pycache__ app/**/__pycache__

            # Force VM code to exactly match GitHub — no local changes can block this
            git fetch origin
            git reset --hard origin/main

            # Rebuild and restart containers
            docker compose down
            docker compose up -d --build

            # Show running containers
            docker compose ps
          ENDSSH