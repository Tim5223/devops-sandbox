[project]
name = "devops-sandbox"
version = "0.1.0"
description = "Personal DevOps sandbox — API, pipelines, and automation"
requires-python = ">=3.12"

dependencies = [
    # Database
    "psycopg[binary]>=3.2",        # PostgreSQL async-capable driver
    "sqlalchemy>=2.0",             # ORM + core query builder
    "alembic>=1.13",               # DB migrations

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",      # Settings from .env

    # Pipelines / data
    "pandas>=2.2",
    "httpx>=0.27",                 # Async HTTP client for ETL sources

    # Automation / scripting
    "typer>=0.12",                 # CLI tools
    "rich>=13.7",                  # Pretty terminal output
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",                   # Linter + formatter
    "mypy>=1.10",
]

[project.scripts]
sandbox = "app.scripts.cli:app"   # `uv run sandbox` entry point

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
