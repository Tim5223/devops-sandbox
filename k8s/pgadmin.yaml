apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: devops-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: PGADMIN_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sandbox-secrets
                  key: PGADMIN_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: devops-sandbox
spec:
  selector:
    app: pgadmin
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30500
